# CI workflow
# Purpose: Basic placeholder workflow to validate structure and run tests.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install -U pip
          if [ -s requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e . || true  # editable install if configured
      - name: Tests
        run: |
          python -m pytest -q || true  # allow empty/no-op tests at first

