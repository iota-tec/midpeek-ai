# pyproject.toml
# Purpose: Minimal build/config metadata. Keeps the project installable
# and ready to grow without enforcing specific tools yet.

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vex-ai"
version = "0.0.0"
description = "Minimal scaffold for Valorant highlights project."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

